const $=id=>document.getElementById(id);
let ord,i,sc,wrong;
function sh(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(list){ord=sh(list);i=0;sc=0;wrong=[];show()}
function show(){
 if(i>=ord.length)return done();
 const x=ord[i];$("pb").style.width=(i/ord.length*100)+"%";
 $("sub").textContent=Q.length+" ข้อ จากข้อสอบ 2 ชุด สลับข้อและตัวเลือกทุกรอบ";
 const o=sh(x.o);
 $("c").innerHTML=`<div class="m"><span>ข้อ ${i+1}/${ord.length}</span><span>คะแนน ${sc}</span></div><p class="q"></p><div id="os"></div><div id="fb"></div>`;
 $("c").querySelector(".q").textContent=x.q;
 o.forEach(t=>{const b=document.createElement("button");b.className="o";b.textContent=t;b.onclick=()=>pick(b,t,x);$("os").appendChild(b)})
}
function pick(b,t,x){
 const bs=[...document.querySelectorAll(".o")];bs.forEach(e=>{e.disabled=true;if(e.textContent===x.c)e.classList.add("ok")});
 if(t===x.c)sc++;else{b.classList.add("no");wrong.push(x)}
 $("fb").innerHTML='<button class="b" id="nx">ข้อถัดไป</button>';$("nx").focus();$("nx").onclick=()=>{i++;show()}
}
function done(){
 $("pb").style.width="100%";
 $("c").innerHTML=`<p class="q">ได้ ${sc}/${ord.length} คะแนน</p><button class="b" id="a">เล่นใหม่ทั้งหมด</button>${wrong.length?'<button class="b g" id="w">ทำซ้ำเฉพาะข้อที่ผิด ('+wrong.length+')</button>':""}`;
 $("a").onclick=()=>start(Q);if(wrong.length)$("w").onclick=()=>start(wrong)
}
start(Q);
</script></body></html>
